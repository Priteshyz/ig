<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>IG Bulk Ripper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #0a0a0a;
    --accent: #00ff66; 
    --text-main: #ffffff;
    --text-muted: #888888;
    --border: #222222;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 24px;
    padding-bottom: 100px;
  }

  .header { margin-bottom: 24px; }
  .header h1 { font-size: 32px; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 14px; color: var(--text-muted); margin-top: 8px; }

  .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

  textarea {
    width: 100%; padding: 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
    color: white; font-size: 14px; outline: none; transition: border-color 0.2s;
    min-height: 80px; resize: vertical; font-family: inherit;
  }
  textarea:focus { border-color: var(--accent); }

  .btn {
    width: 100%; background: var(--text-main); color: #000; border: none;
    padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800;
    cursor: pointer; transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .media-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  
  .media-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
  }

  .media-card.selected::after {
    content: '✓';
    position: absolute;
    top: 8px; right: 8px;
    background: var(--accent);
    color: #000;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; z-index: 10;
  }

  .media-preview {
    width: 100%; height: 200px;
    object-fit: cover;
    background: #111;
    display: block;
  }

  .media-info {
    padding: 10px;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .media-info span {
    color: var(--accent);
    font-weight: bold;
  }

  /* FLOATING ACTION BAR */
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    z-index: 100;
    transform: translateY(100%);
    transition: transform 0.3s;
  }

  .action-bar.show {
    transform: translateY(0);
  }

  .status-text { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .status-text.error { color: #ff4444; }
</style>
</head>
<body>

  <div class="header">
    <h1>Bulk IG.<br><span>Max Quality.</span></h1>
    <p>Paste links (one per line) to rip carousels and reels.</p>
  </div>

  <div class="input-group">
    <textarea id="urlInput" placeholder="https://www.instagram.com/reel/...&#10;https://www.instagram.com/p/..."></textarea>
    <button class="btn" id="fetchBtn">Scan Links</button>
  </div>

  <div class="grid" id="mediaGrid">
    <!-- Cards get injected here -->
  </div>

  <div class="status-text" id="statusText">Ready.</div>

  <div class="action-bar" id="actionBar">
    <button class="btn" id="downloadAllBtn" style="background: var(--accent); color: #000;">Download Selected (<span id="selectedCount">0</span>)</button>
  </div>

<script>
  const urlInput = document.getElementById('urlInput');
  const fetchBtn = document.getElementById('fetchBtn');
  const mediaGrid = document.getElementById('mediaGrid');
  const statusText = document.getElementById('statusText');
  const actionBar = document.getElementById('actionBar');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const selectedCount = document.getElementById('selectedCount');

  let allMedia = []; // Array of { url, type, id }

  function setStatus(msg, isError = false) {
    statusText.textContent = msg;
    statusText.className = isError ? 'status-text error' : 'status-text';
  }

  async function fetchInstagram() {
    const rawInput = urlInput.value.trim();
    if (!rawInput) {
      setStatus('Please paste at least one Instagram link.', true);
      return;
    }

    // Split by newlines or spaces
    const links = rawInput.split(/\s+/).filter(u => u.includes('instagram.com'));
    
    if (links.length === 0) {
      setStatus('No valid Instagram links found.', true);
      return;
    }

    fetchBtn.disabled = true;
    mediaGrid.innerHTML = '';
    allMedia = [];
    actionBar.classList.remove('show');
    setStatus(`Scanning ${links.length} link(s)...`);

    let successCount = 0;

    for (let i = 0; i < links.length; i++) {
      try {
        // Using a robust IG parser API
        const apiUrl = `https://api.videodownloaderpro.com/api/instagram?url=${encodeURIComponent(links[i])}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.success && data.data) {
          const mediaData = data.data;
          
          // Check if it's a carousel (multiple media)
          if (mediaData.medias && mediaData.medias.length > 0) {
            mediaData.medias.forEach((m, index) => {
              addMediaToGrid(m.url, m.type, `${mediaData.title || 'IG Post'} - ${index + 1}`);
            });
          } else {
            // Single media
            const url = mediaData.video_url || mediaData.image_url;
            const type = mediaData.video_url ? 'video' : 'image';
            addMediaToGrid(url, type, mediaData.title || 'IG Post');
          }
          successCount++;
        } else {
          console.warn(`Failed to parse: ${links[i]}`);
        }
      } catch (err) {
        console.error(`Error on ${links[i]}:`, err);
      }
    }

    fetchBtn.disabled = false;
    
    if (successCount > 0) {
      setStatus(`Found media from ${successCount} link(s). Select items to download.`);
      actionBar.classList.add('show');
    } else {
      setStatus('Failed to fetch any media. Links might be private.', true);
    }
  }

  function addMediaToGrid(url, type, title) {
    const id = 'media_' + Math.random().toString(36).substr(2, 9);
    
    // Create Card
    const card = document.createElement('div');
    card.className = 'media-card selected'; // Select by default
    card.dataset.id = id;
    card.dataset.url = url;
    card.dataset.type = type;

    // Preview (Image or Video)
    let previewHtml = '';
    if (type === 'video') {
      previewHtml = `<video class="media-preview" src="${url}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>`;
    } else {
      previewHtml = `<img class="media-preview" src="${url}">`;
    }

    card.innerHTML = `
      ${previewHtml}
      <div class="media-info"><span>${type.toUpperCase()}</span> • ${title}</div>
    `;

    // Click to toggle selection
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      updateSelectionCount();
    });

    mediaGrid.appendChild(card);
    
    allMedia.push({
      id: id,
      url: url,
      type: type
    });

    updateSelectionCount();
  }

  function updateSelectionCount() {
    const selected = document.querySelectorAll('.media-card.selected');
    selectedCount.textContent = selected.length;
    downloadAllBtn.disabled = selected.length === 0;
  }

  async function downloadSelected() {
    const selectedCards = document.querySelectorAll('.media-card.selected');
    if (selectedCards.length === 0) return;

    downloadAllBtn.disabled = true;
    setStatus(`Downloading ${selectedCards.length} items...`);

    for (let i = 0; i < selectedCards.length; i++) {
      const card = selectedCards[i];
      const url = card.dataset.url;
      const type = card.dataset.type;
      
      try {
        // Fetch as Blob to force download
        const response = await fetch(url);
        const blob = await response.blob();
        
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        
        const ext = type === 'video' ? 'mp4' : 'jpg';
        a.download = `ig_${type}_${Date.now()}_${i}.${ext}`;
        
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(blobUrl);
        
        // Tiny delay to prevent browser from blocking multiple downloads
        await new Promise(r => setTimeout(r, 500));
        
      } catch (err) {
        console.error('Blob failed, opening direct link', err);
        window.open(url, '_blank');
      }
    }

    downloadAllBtn.disabled = false;
    setStatus('Download sequence complete!');
  }

  fetchBtn.addEventListener('click', fetchInstagram);
  downloadAllBtn.addEventListener('click', downloadSelected);
</script>
</body>
</html>
